name: CI
on:
  push:
    branches:
      - '**'
  workflow_dispatch:
  pull_request:
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true
permissions:
  contents: read
  actions: read
jobs:
  build:
    name: Unit tests and debug build
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7
      - name: Download verified native transports
        uses: actions/download-artifact@v8
        with:
          pattern: qThrone-carriers-*
          path: carrier-artifacts
          run-id: '38151455147'
          github-token: ${{ github.token }}
      - name: Verify and stage native transports
        shell: bash
        run: |
          set -euo pipefail
          for abi in arm64-v8a armeabi-v7a x86_64; do
            source="carrier-artifacts/qThrone-carriers-$abi"
            (cd "$source"; sha256sum -c SHA256SUMS)
            mkdir -p "deployment/carriers/$abi" "app/src/main/assets/carrier-licenses/$abi"
            cp "$source/"*.so "deployment/carriers/$abi/"
            cp "$source/"*-LICENSE "$source/SOURCES.txt" "app/src/main/assets/carrier-licenses/$abi/"
          done
      - name: Build
        uses: ./.github/actions/android-build
        with:
          tasks: app:testOssDebugUnitTest app:assembleOssDebug

      - name: Upload debug APK
        uses: actions/upload-artifact@v7
        with:
          name: qThroneMobile-debug
          path: app/build/outputs/apk/oss/debug/*.apk
          if-no-files-found: error
      - name: Upload test reports
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: qThroneMobile-test-reports
          path: app/build/reports/tests/
          if-no-files-found: ignore
