name: qThroneMobile release
run-name: qThroneMobile release
on:
  workflow_dispatch:
    inputs:
      publish:
        description: Publish the release v<VERSION_NAME> at this commit (otherwise the APKs are only uploaded as a workflow artifact)
        type: boolean
        default: true
concurrency:
  group: release
  cancel-in-progress: false
permissions:
  contents: write
  actions: read
jobs:
  release:
    name: APK
    runs-on: ubuntu-latest
    env:
      SIGNING_KEYSTORE_B64: ${{ secrets.SIGNING_KEYSTORE_B64 }}
      SIGNING_STORE_PASSWORD: ${{ secrets.SIGNING_STORE_PASSWORD }}
      SIGNING_KEY_ALIAS: ${{ secrets.SIGNING_KEY_ALIAS }}
      SIGNING_KEY_PASSWORD: ${{ secrets.SIGNING_KEY_PASSWORD }}
    steps:
      - name: Checkout
        uses: actions/checkout@v7
      # Public tags use three version components and always increase.
      - name: Version
        id: version
        env:
          PUBLISH: ${{ inputs.publish }}
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          python3 buildScript/release_tag.py
      - name: Build
        uses: ./.github/actions/android-build
        with:
          tasks: app:assembleOssRelease
          channel: stable
          build-number: '999'
          sign: 'true'
      - name: Release assets
        run: python3 buildScript/release_assets.py app/build/outputs/apk/oss/release dist stable
      - name: Upload artifact
        if: ${{ !inputs.publish }}
        uses: actions/upload-artifact@v7
        with:
          name: qThroneMobile-${{ steps.version.outputs.tag }}
          path: dist/
          if-no-files-found: error
          retention-days: 14
      - name: Publish release
        if: ${{ inputs.publish }}
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          TAG: ${{ steps.version.outputs.tag }}
          RELEASE_NAME: ${{ steps.version.outputs.name }}
        run: |
          set -euo pipefail
          gh release create "$TAG" dist/* --target "$GITHUB_SHA" --title "$RELEASE_NAME" --latest --notes-file RELEASE_NOTES.md
