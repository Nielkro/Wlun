name: Wlun release
run-name: Wlun release
on:
  push:
    tags:
      - 'v*'
  # Every green CI run on stable publishes its VERSION_NAME once.
  workflow_run:
    workflows: [Wlun CI]
    types: [completed]
    branches: [stable]
  workflow_dispatch:
    inputs:
      publish:
        description: Publish the release v<VERSION_NAME> at this commit (otherwise the APKs are only uploaded as a workflow artifact)
        type: boolean
        default: true
concurrency:
  group: release
  cancel-in-progress: false
permissions:
  contents: write
  actions: read
jobs:
  gate:
    name: Unpublished version
    if: >-
      github.event_name == 'workflow_run' && github.event.workflow_run.conclusion == 'success' &&
      github.event.workflow_run.head_repository.full_name == github.repository &&
      (github.event.workflow_run.event == 'push' || github.event.workflow_run.event == 'workflow_dispatch')
    runs-on: ubuntu-latest
    outputs:
      publish: ${{ steps.check.outputs.publish }}
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          ref: ${{ github.event.workflow_run.head_sha }}
      - name: Check
        id: check
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          set -euo pipefail
          VERSION_NAME=$(sed -n 's/^VERSION_NAME=//p' nb4a.properties | tr -d '[:space:]')
          DRAFT=$(gh release view "v$VERSION_NAME" --json isDraft --jq .isDraft 2>/dev/null || true)
          if [[ "$DRAFT" == false ]]; then
            echo "::notice::v$VERSION_NAME is already published: nothing to release"
            echo "publish=false" >> "$GITHUB_OUTPUT"
          else
            echo "publish=true" >> "$GITHUB_OUTPUT"
          fi
  release:
    name: APK
    needs: gate
    if: ${{ always() && (github.event_name != 'workflow_run' || needs.gate.outputs.publish == 'true') }}
    runs-on: ubuntu-latest
    env:
      SIGNING_KEYSTORE_B64: ${{ secrets.SIGNING_KEYSTORE_B64 }}
      SIGNING_STORE_PASSWORD: ${{ secrets.SIGNING_STORE_PASSWORD }}
      SIGNING_KEY_ALIAS: ${{ secrets.SIGNING_KEY_ALIAS }}
      SIGNING_KEY_PASSWORD: ${{ secrets.SIGNING_KEY_PASSWORD }}
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          ref: ${{ github.event.workflow_run.head_sha || github.sha }}
      - name: Release numbering regression
        run: |
          python3 buildScript/test_release_tag.py
          python3 buildScript/test_release_metadata.py
      - name: Require pinned CSQTT 2.5.0 Legacy
        run: python3 -c "import json; assert json.load(open('native-transports.lock.json'))['secure_socks']['csqtt_commit'] == '2066156119a5afe7d63e104aefdc8e0849999d03', 'CSQTT 2.5.0 Legacy transport pin changed'"
      # Public tags use three version components and always increase.
      - name: Version
        id: version
        env:
          PUBLISH: ${{ github.event_name != 'workflow_dispatch' || inputs.publish }}
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          python3 buildScript/release_tag.py
      - name: Build
        uses: ./.github/actions/android-build
        with:
          tasks: app:testOssDebugUnitTest app:assembleOssRelease
          channel: stable
          build-number: ${{ steps.version.outputs.build }}
          sign: 'true'
      - name: Verify release SSH classes
        run: python3 buildScript/check_release_ssh.py app/build/outputs/apk/oss/release
      - name: Upload test reports
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: Wlun-release-test-reports
          path: app/build/reports/tests/
          if-no-files-found: ignore
      - name: Release assets
        run: python3 buildScript/release_assets.py app/build/outputs/apk/oss/release dist stable
      - name: Upload arm64-v8a APK
        if: ${{ github.event_name != 'push' && !inputs.publish }}
        uses: actions/upload-artifact@v7
        with:
          name: Wlun-${{ steps.version.outputs.tag }}-arm64-v8a
          path: dist/*arm64-v8a*.apk
          if-no-files-found: error
          retention-days: 14
      - name: Upload armeabi-v7a APK
        if: ${{ github.event_name != 'push' && !inputs.publish }}
        uses: actions/upload-artifact@v7
        with:
          name: Wlun-${{ steps.version.outputs.tag }}-armeabi-v7a
          path: dist/*armeabi-v7a*.apk
          if-no-files-found: error
          retention-days: 14
      - name: Upload x86_64 APK
        if: ${{ github.event_name != 'push' && !inputs.publish }}
        uses: actions/upload-artifact@v7
        with:
          name: Wlun-${{ steps.version.outputs.tag }}-x86_64
          path: dist/*x86_64*.apk
          if-no-files-found: error
          retention-days: 14
      - name: Upload universal APK
        if: ${{ github.event_name != 'push' && !inputs.publish }}
        uses: actions/upload-artifact@v7
        with:
          name: Wlun-${{ steps.version.outputs.tag }}-universal
          path: dist/*universal*.apk
          if-no-files-found: error
          retention-days: 14
      - name: Publish release
        if: ${{ github.event_name != 'workflow_dispatch' || inputs.publish }}
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          TAG: ${{ steps.version.outputs.tag }}
          TARGET: ${{ github.event.workflow_run.head_sha || github.sha }}
          RELEASE_NAME: ${{ steps.version.outputs.name }}
        run: |
          python3 buildScript/publish_release.py
