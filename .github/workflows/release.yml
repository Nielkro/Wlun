name: qThroneMobile release
run-name: qThroneMobile release
on:
  workflow_dispatch:
    inputs:
      publish:
        description: Publish the release v<VERSION_NAME> at this commit (otherwise the APKs are only uploaded as a workflow artifact)
        type: boolean
        default: true
concurrency:
  group: release
  cancel-in-progress: false
permissions:
  contents: write
  actions: read
jobs:
  release:
    name: APK
    runs-on: ubuntu-latest
    env:
      SIGNING_KEYSTORE_B64: ${{ secrets.SIGNING_KEYSTORE_B64 }}
      SIGNING_STORE_PASSWORD: ${{ secrets.SIGNING_STORE_PASSWORD }}
      SIGNING_KEY_ALIAS: ${{ secrets.SIGNING_KEY_ALIAS }}
      SIGNING_KEY_PASSWORD: ${{ secrets.SIGNING_KEY_PASSWORD }}
    steps:
      - name: Checkout
        uses: actions/checkout@v7
      # The tag is v<VERSION_NAME>; a published release never reuses an existing tag.
      - name: Version
        id: version
        env:
          PUBLISH: ${{ inputs.publish }}
        run: |
          set -euo pipefail
          VERSION_NAME=$(sed -n 's/^VERSION_NAME=//p' nb4a.properties | tr -d '\r[:space:]')
          test -n "$VERSION_NAME"
          TAG="v$VERSION_NAME"
          if [ "$PUBLISH" = "true" ] && git ls-remote --exit-code --tags origin "refs/tags/$TAG" > /dev/null; then
            echo "::error::$TAG already exists: raise VERSION_NAME in nb4a.properties for a new release"
            exit 1
          fi
          echo "tag=$TAG" >> "$GITHUB_OUTPUT"
      - name: Download verified native transports
        uses: actions/download-artifact@v8
        with:
          pattern: qThrone-carriers-*
          path: carrier-artifacts
          run-id: '38171883382'
          github-token: ${{ github.token }}
      - name: Verify and stage native transports
        shell: bash
        run: |
          set -euo pipefail
          for abi in arm64-v8a armeabi-v7a x86_64; do
            source="carrier-artifacts/qThrone-carriers-$abi"
            (cd "$source"; sha256sum -c SHA256SUMS)
            mkdir -p "deployment/carriers/$abi" "app/src/main/assets/carrier-licenses/$abi"
            cp "$source/"*.so "deployment/carriers/$abi/"
            cp "$source/"*-LICENSE "$source/SOURCES.txt" "app/src/main/assets/carrier-licenses/$abi/"
          done
      - name: Build
        uses: ./.github/actions/android-build
        with:
          tasks: app:assembleOssRelease
          channel: stable
          build-number: '999'
          sign: 'true'
      - name: Release assets
        run: python3 buildScript/release_assets.py app/build/outputs/apk/oss/release dist stable
      - name: Upload artifact
        if: ${{ !inputs.publish }}
        uses: actions/upload-artifact@v7
        with:
          name: qThroneMobile-${{ steps.version.outputs.tag }}
          path: dist/
          if-no-files-found: error
          retention-days: 14
      - name: Publish release
        if: ${{ inputs.publish }}
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          TAG: ${{ steps.version.outputs.tag }}
        run: |
          set -euo pipefail
          gh release create "$TAG" dist/* --target "$GITHUB_SHA" --title "${TAG#v}" --prerelease --notes-file RELEASE_NOTES.md
