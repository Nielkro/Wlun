name: Wlun release
run-name: Wlun release
on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      publish:
        description: Publish the release v<VERSION_NAME> at this commit (otherwise the APKs are only uploaded as a workflow artifact)
        type: boolean
        default: true
concurrency:
  group: release
  cancel-in-progress: false
permissions:
  contents: write
  actions: read
jobs:
  release:
    name: APK
    runs-on: ubuntu-latest
    env:
      SIGNING_KEYSTORE_B64: ${{ secrets.SIGNING_KEYSTORE_B64 }}
      SIGNING_STORE_PASSWORD: ${{ secrets.SIGNING_STORE_PASSWORD }}
      SIGNING_KEY_ALIAS: ${{ secrets.SIGNING_KEY_ALIAS }}
      SIGNING_KEY_PASSWORD: ${{ secrets.SIGNING_KEY_PASSWORD }}
    steps:
      - name: Checkout
        uses: actions/checkout@v7
      - name: Release numbering regression
        run: python3 buildScript/test_release_tag.py
      # Public tags use three version components and always increase.
      - name: Version
        id: version
        env:
          PUBLISH: ${{ github.event_name == 'push' || inputs.publish }}
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          python3 buildScript/release_tag.py
      - name: Build
        uses: ./.github/actions/android-build
        with:
          tasks: app:testOssDebugUnitTest app:assembleOssRelease
          channel: stable
          build-number: ${{ steps.version.outputs.build }}
          sign: 'true'
      - name: Verify release SSH classes
        run: python3 buildScript/check_release_ssh.py app/build/outputs/apk/oss/release
      - name: Upload test reports
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: Wlun-release-test-reports
          path: app/build/reports/tests/
          if-no-files-found: ignore
      - name: Release assets
        run: python3 buildScript/release_assets.py app/build/outputs/apk/oss/release dist stable
      - name: Upload arm64-v8a APK
        if: ${{ github.event_name != 'push' && !inputs.publish }}
        uses: actions/upload-artifact@v7
        with:
          name: Wlun-${{ steps.version.outputs.tag }}-arm64-v8a
          path: dist/*arm64-v8a*.apk
          if-no-files-found: error
          retention-days: 14
      - name: Upload armeabi-v7a APK
        if: ${{ github.event_name != 'push' && !inputs.publish }}
        uses: actions/upload-artifact@v7
        with:
          name: Wlun-${{ steps.version.outputs.tag }}-armeabi-v7a
          path: dist/*armeabi-v7a*.apk
          if-no-files-found: error
          retention-days: 14
      - name: Upload x86_64 APK
        if: ${{ github.event_name != 'push' && !inputs.publish }}
        uses: actions/upload-artifact@v7
        with:
          name: Wlun-${{ steps.version.outputs.tag }}-x86_64
          path: dist/*x86_64*.apk
          if-no-files-found: error
          retention-days: 14
      - name: Upload universal APK
        if: ${{ github.event_name != 'push' && !inputs.publish }}
        uses: actions/upload-artifact@v7
        with:
          name: Wlun-${{ steps.version.outputs.tag }}-universal
          path: dist/*universal*.apk
          if-no-files-found: error
          retention-days: 14
      - name: Publish release
        if: ${{ github.event_name == 'push' || inputs.publish }}
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          TAG: ${{ steps.version.outputs.tag }}
          RELEASE_NAME: ${{ steps.version.outputs.name }}
        run: |
          set -euo pipefail
          if [[ "$TAG" == *-beta.* || "$TAG" == *-rc.* ]]; then
            gh release create "$TAG" dist/* --target "$GITHUB_SHA" --title "$RELEASE_NAME" --prerelease --latest=false --notes-file RELEASE_NOTES.md
          else
            gh release create "$TAG" dist/* --target "$GITHUB_SHA" --title "$RELEASE_NAME" --latest --notes-file RELEASE_NOTES.md
          fi
